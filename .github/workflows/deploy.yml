name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: water-system-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build public interface
        run: npm run build
        env:
          VITE_PUBLIC_SITE: 'true'
          VITE_API_ROOT: '/api'
          VITE_DATA_SOURCE: 'simulation'
      - name: Deploy existing water-system production project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=water-system --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}